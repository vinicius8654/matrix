<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Controller</title>
<style>
body {
  background: black;
  color: #2563eb;
  font-family: monospace;
  padding: 20px;
}

#preview {
  white-space: pre-wrap;
  font-size: 20px;
  border: 1px solid #2563eb;
  padding: 20px;
  height: 90vh;
  overflow-y: auto;
}
</style>
</head>
<body>

<h2>📡 Modo Apresentador — CTRL + K limpa rápido</h2>
<div id="preview"></div>

<!-- CDN Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
// ====== CONFIGURAÇÃO (SÓ ALTERAR ISSO) ======
const SUPABASE_URL = "https://cjbfcihsswjvdadzjfen.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNqYmZjaWhzc3dqdmRhZHpqZmVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQxMDI2NTIsImV4cCI6MjA3OTY3ODY1Mn0.121szlnOSL7es3cSJcnzVtrLmHcxw3p4m9U1S5HvSj0";
// ============================================

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const preview = document.getElementById("preview");

let buffer = "";
let lastTypeTime = Date.now();
let matrixActive = false;

// Cria canal realtime
const channel = supabase.channel("matrix-live");

async function send(msg) {
  await channel.send({
    type: "broadcast",
    event: "message",
    payload: { data: msg }
  });
}

// Conecta
channel.subscribe();

document.addEventListener("keydown", (e) => {
  lastTypeTime = Date.now();

  if (matrixActive) {
    send("__STOP_MATRIX__");
    matrixActive = false;
  }

  if (e.ctrlKey && e.key.toLowerCase() === "l") {
    e.preventDefault();
    buffer = "";
    send("__CLEAR__");
    preview.textContent = "";
    return;
  }

  if (e.ctrlKey && e.key.toLowerCase() === "k") {
    e.preventDefault();
    buffer = "";
    send("__FAST_CLEAR__");
    preview.textContent = "";
    return;
  }

  if (e.key.length === 1) {
    buffer += e.key;
    send(e.key);
  } 
  else if (e.key === "Enter") {
    buffer += "\n";
    send("\n");
  } 
  else if (e.key === "Backspace") {
    e.preventDefault();
    buffer = buffer.slice(0, -1);
    send("__BACKSPACE__");
  }

  preview.textContent = buffer;
});

// Matrix automático por inatividade
setInterval(() => {
  if (!matrixActive && Date.now() - lastTypeTime > 6000) {
    matrixActive = true;
    send("__START_MATRIX__");
  }
}, 1000);
</script>

</body>
</html>
