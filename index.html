<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Viewer</title>

<style>
* { margin:0; padding:0; }

body {
  background:black;
  color:#2563eb;
  font-family:monospace;
  overflow:hidden;
}

/* MATRIX */
#matrixCanvas {
  position:fixed;
  inset:0;
  background:black;
  z-index:2;
  opacity:0;
  transition:opacity 1.2s ease;
}

/* TERMINAL */
#terminal {
  position:fixed;
  inset:0;
  padding:40px;
  font-size:22px;
  white-space:pre-wrap;
  z-index:1;
  background:black;
  opacity:1;
  transition:opacity 1.2s ease;
}

/* CURSOR */
.cursor {
  animation:blink 1s steps(1) infinite;
}
@keyframes blink {
  50% { opacity:0; }
}

/* CRT OVERLAY */
#crt {
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:9999;
  background:
    radial-gradient(circle at center, rgba(37,99,235,0.06), transparent 55%),
    repeating-linear-gradient(
      to bottom,
      rgba(37,99,235,0.12) 0px,
      rgba(37,99,235,0.04) 2px,
      rgba(0,0,0,0.35) 4px
    );
  animation:crtFlicker .12s infinite;
}
@keyframes crtFlicker {
  50% { opacity:0.85; }
}
</style>
</head>
<body>

<canvas id="matrixCanvas"></canvas>
<div id="terminal"></div>
<div id="crt"></div>

<script>
const terminal = document.getElementById("terminal");
const canvas   = document.getElementById("matrixCanvas");
const ctx      = canvas.getContext("2d");
const channel  = new BroadcastChannel("matrix-live");

let buffer = "";
let matrixRunning = false;

let cursor = document.createElement("span");
cursor.className = "cursor";
cursor.textContent = "█";

/* ===== FUNÇÃO DE RENDER DO TERMINAL ===== */
function render() {
  if (matrixRunning) return;
  terminal.textContent = buffer;
  terminal.appendChild(cursor);
}

/* ===== CONTROLE DO MATRIX ===== */
function startMatrix() {
  matrixRunning = true;
  canvas.style.opacity  = "1";
  terminal.style.opacity = "0";
}

function stopMatrix() {
  matrixRunning = false;
  canvas.style.opacity = "0";

  setTimeout(() => {
    terminal.style.opacity = "1";
    render();
  }, 1000);
}

/* ===== RECEBIMENTO DOS COMANDOS ===== */
channel.onmessage = (e) => {

  if (e.data === "__START_MATRIX__") {
    startMatrix();
    return;
  }

  if (e.data === "__STOP_MATRIX__") {
    stopMatrix();
    return;
  }

  if (e.data === "__CLEAR__") {
    buffer = "";
    render();
    return;
  }

  if (e.data === "__FAST_CLEAR__") {
    const iv = setInterval(() => {
      if (buffer.length > 0) {
        buffer = buffer.slice(0, -6);
        render();
      } else {
        clearInterval(iv);
      }
    }, 10);
    return;
  }

  if (e.data === "__BACKSPACE__") {
    buffer = buffer.slice(0, -1);
  } else {
    buffer += e.data;
  }

  render();
};

/* ===== MATRIX ENGINE ===== */
let cols, drops;

function resize() {
  canvas.width  = innerWidth;
  canvas.height = innerHeight;
  cols  = Math.floor(canvas.width / 18);
  drops = Array(cols).fill(0);
}
resize();
addEventListener("resize", resize);

function matrixLoop() {
  if (matrixRunning) {
    ctx.fillStyle = "rgba(0,0,0,0.03)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle = "#2563eb";
    ctx.font = "20px monospace";

    for (let i = 0; i < drops.length; i++) {
      const char = String.fromCharCode(33 + Math.random() * 94);
      ctx.fillText(char, i * 18, drops[i] * 20);

      if (drops[i] * 20 > canvas.height && Math.random() > 0.975) {
        drops[i] = 0;
      }
      drops[i]++;
    }
  }
  requestAnimationFrame(matrixLoop);
}

render();
matrixLoop();
</script>

</body>
</html>
