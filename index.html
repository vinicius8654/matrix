<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Viewer - Matrix Avançada</title>

<style>
* { margin:0; padding:0; box-sizing: border-box; }
html,body { height:100%; }

body {
  background:black;
  color:#2563eb;
  font-family:monospace;
  overflow:hidden;
}

/* MATRIX CANVAS */
#matrixCanvas {
  position:fixed;
  inset:0;
  background:black;
  z-index:2;
  opacity:0;
  transition:opacity 1.2s ease;
}

/* CRT NOISE CANVAS (dinâmico) */
#crtCanvas {
  position:fixed;
  inset:0;
  z-index:10000;
  pointer-events:none;
  opacity:0;
  transition:opacity 0.5s linear;
}

/* TERMINAL */
#terminal {
  position:fixed;
  inset:0;
  padding:40px;
  font-size:22px;
  white-space:pre-wrap;
  z-index:1;
  background:black;
  opacity:1;
  transition:opacity 1.2s ease;
}

/* CURSOR */
.cursor {
  animation:blink 1s steps(1) infinite;
}

@keyframes blink {
  50% { opacity:0; }
}

/* CRT STATIC GRADIENT OVERLAY (subtle) */
#crt {
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:9999;
  background:
    radial-gradient(circle at center, rgba(37,99,235,0.06), transparent 55%),
    repeating-linear-gradient(
      to bottom,
      rgba(37,99,235,0.12) 0px,
      rgba(37,99,235,0.04) 2px,
      rgba(0,0,0,0.35) 4px
    );
  mix-blend-mode: screen;
  animation:crtFlicker .12s infinite;
}

@keyframes crtFlicker {
  50% { opacity:0.85; }
}

/* shake animation for screen */
@keyframes shakeAnim {
  0% { transform: translate(0, 0); }
  20% { transform: translate(-6px, 3px); }
  40% { transform: translate(5px, -3px); }
  60% { transform: translate(-4px, 4px); }
  80% { transform: translate(4px, -2px); }
  100% { transform: translate(0, 0); }
}

canvas {
  image-rendering: pixelated;
  will-change: transform, filter;
}
</style>
</head>

<body>

<canvas id="matrixCanvas"></canvas>
<div id="terminal"></div>
<div id="crt"></div>
<canvas id="crtCanvas"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* ====== CONFIGURAÇÃO (Manteve igual) ====== */
const SUPABASE_URL = "https://cjbfcihsswjvdadzjfen.supabase.co";
const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNqYmZjaWhzc3dqdmRhZHpqZmVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQxMDI2NTIsImV4cCI6MjA3OTY3ODY1Mn0.121szlnOSL7es3cSJcnzVtrLmHcxw3p4m9U1S5HvSj0";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* DOM */
const terminal   = document.getElementById("terminal");
const canvas     = document.getElementById("matrixCanvas");
const ctx        = canvas.getContext("2d");
const crtCanvas  = document.getElementById("crtCanvas");
const crtCtx     = crtCanvas.getContext("2d");
const crtDiv     = document.getElementById("crt");

let buffer = "";
let matrixRunning = false;

let cursor = document.createElement("span");
cursor.className = "cursor";
cursor.textContent = "█";

/* ===== Supabase realtime channel (mantive — não altera gestos, mas permite controlar matriz via broadcast) ===== */
const channel = supabase.channel("matrix-live");

channel
  .on("broadcast", { event: "message" }, (payload) => {
    const data = payload.payload.data;

    if (data === "__START_MATRIX__") { startMatrix(); return; }
    if (data === "__STOP_MATRIX__")  { stopMatrix(); return; }
    if (data === "__CLEAR__")        { buffer = ""; render(); return; }

    if (data === "__FAST_CLEAR__") {
      const iv = setInterval(() => {
        if (buffer.length > 0) {
          buffer = buffer.slice(0, -6);
          render();
        } else {
          clearInterval(iv);
        }
      }, 10);
      return;
    }

    // Efeitos remotos opcionais (se alguém enviar "__FLASH__", "__SHAKE__", "__GLITCH__", "__RAIN_FAST__", "__RAINBOW__")
    if (data === "__FLASH__") { triggerEffect("FLASH"); return; }
    if (data === "__SHAKE__") { triggerEffect("SHAKE"); return; }
    if (data === "__GLITCH__") { triggerEffect("GLITCH"); return; }
    if (data === "__RAIN_FAST__") { triggerEffect("RAIN_FAST"); return; }
    if (data === "__RAINBOW__") { triggerEffect("RAINBOW"); return; }

    if (data === "__BACKSPACE__") {
      buffer = buffer.slice(0, -1);
    } else {
      buffer += data;
    }

    render();
  })
  .subscribe();

/* ===== RENDER terminal ===== */
function render() {
  if (matrixRunning) return;
  terminal.textContent = buffer;
  terminal.appendChild(cursor);
}

/* ===== MATRIX START/STOP (sem vídeo) ===== */
let asciiIntervalId = null;

function startMatrix() {
  matrixRunning = true;
  canvas.style.opacity = "1";
  crtCanvas.style.opacity = "1";
  crtDiv.style.opacity = "1";
  terminal.style.opacity = "0";
  resetColumnStates();

  // iniciar ASCII cycle (a cada 2 minutos mostra por 1s)
  if (!asciiIntervalId) {
    // mostrar pela primeira vez após 2 minutos
    asciiIntervalId = setInterval(() => {
      if (matrixRunning) showAsciiLogo(1000);
    }, 120000);
  }
}

function stopMatrix() {
  matrixRunning = false;
  canvas.style.opacity = "0";
  crtCanvas.style.opacity = "0";

  setTimeout(() => {
    terminal.style.opacity = "1";
    render();
  }, 1200);
}

/* ===== MATRIX ENGINE ===== */
const JAPANESE =
"アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲンヴヵヶ";

let cols, drops;
let baseFontSize = 22;
let columnSpeed = [];
let columnMultiplier = [];
let columnTimer = [];
let columnState = [];
let lastTime = performance.now();

/* FEATURES FLAGS */
let rainbowMode = false;
let rainbowExpires = 0;

function resize() {
  const dpr = Math.max(1, window.devicePixelRatio || 1);

  // reset transform/scale to avoid cumulative scaling
  ctx.setTransform(1,0,0,1,0,0);
  crtCtx.setTransform(1,0,0,1,0,0);

  canvas.width  = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  canvas.style.width  = innerWidth + "px";
  canvas.style.height = innerHeight + "px";
  ctx.scale(dpr, dpr);
  ctx.font = `${baseFontSize}px monospace`;

  crtCanvas.width  = innerWidth * dpr;
  crtCanvas.height = innerHeight * dpr;
  crtCanvas.style.width  = innerWidth + "px";
  crtCanvas.style.height = innerHeight + "px";
  crtCtx.scale(dpr, dpr);

  cols = Math.floor(innerWidth / 18);
  drops = Array(cols).fill(0);

  columnSpeed     = new Array(cols).fill(1.0);
  columnMultiplier = new Array(cols).fill(1.0);
  columnTimer      = new Array(cols).fill(0);
  columnState      = new Array(cols).fill("normal");

  for (let i = 0; i < cols; i++) {
    columnSpeed[i] = 0.9 + Math.random() * 1.4;
  }
}

resize();
addEventListener("resize", resize);

function getMatrixChar() {
  const r = Math.random();

  if (r < 0.50)
    return String.fromCharCode(48 + Math.floor(Math.random() * 10));

  if (r < 0.80)
    return String.fromCharCode(65 + Math.floor(Math.random() * 26));

  return JAPANESE[Math.floor(Math.random() * JAPANESE.length)];
}

function resetColumnStates() {
  for (let i=0; i<cols; i++) {
    columnMultiplier[i] = 1.0;
    columnTimer[i] = 0;
    columnState[i] = "normal";
  }
}

function updateColumnStates() {
  for (let i = 0; i < cols; i++) {

    if (columnTimer[i] > 0) {
      columnTimer[i]--;
      if (columnTimer[i] === 0) {
        columnMultiplier[i] = 1.0;
        columnState[i] = "normal";
      }
      continue;
    }

    const r = Math.random();

    if (r > 0.995) {
      columnState[i] = "accel";
      columnMultiplier[i] = 2 + Math.random() * 4;
      columnTimer[i] = 20 + Math.floor(Math.random() * 70);
      continue;
    }

    if (r < 0.002) {
      columnState[i] = "stalled";
      columnMultiplier[i] = 0.0;
      columnTimer[i] = 10 + Math.floor(Math.random() * 90);
      continue;
    }

    if (r > 0.98) {
      columnMultiplier[i] = 1.2 + Math.random() * 0.8;
      columnTimer[i] = 8 + Math.floor(Math.random() * 20);
      columnState[i] = "normal";
    }
  }
}

function matrixLoop(now) {
  const dt = (now - lastTime) || 16;
  lastTime = now;

  if (matrixRunning) {
    // slight fade for trailing
    ctx.fillStyle = "rgba(0,0,0,0.03)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.textBaseline = "top";
    ctx.font = `${baseFontSize}px monospace`;

    updateColumnStates();

    // check rainbow expiration
    if (rainbowMode && now > rainbowExpires) {
      rainbowMode = false;
    }

    for (let i = 0; i < drops.length; i++) {
      const speed = columnSpeed[i] * columnMultiplier[i];

      const headChar = getMatrixChar();

      // head color (if rainbow mode, vary per column and time)
      let headColor = "#bff3ff";
      let trailColor = "#2563eb";

      if (rainbowMode) {
        const hue = Math.floor(((i / Math.max(1, cols)) * 360 + (now / 30)) % 360);
        headColor = `hsl(${hue} 90% 70%)`;
        trailColor = `hsl(${(hue+20)%360} 80% 50%)`;
      }

      ctx.fillStyle = headColor;
      ctx.shadowColor = headColor;
      ctx.shadowBlur = 8;
      ctx.globalAlpha = 1;
      ctx.fillText(headChar, i * 18, drops[i] * 20);

      ctx.shadowBlur = 0;

      const trailLength = 6;
      for (let t = 1; t <= trailLength; t++) {
        const alpha = Math.max(0, 1 - t * 0.16);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = trailColor;
        const ch = getMatrixChar();
        ctx.fillText(ch, i * 18, (drops[i] - t) * 20);
      }

      ctx.globalAlpha = 1;

      const deltaRows = speed * (dt / 16);
      drops[i] += deltaRows;

      if (drops[i] * 20 > innerHeight + 50 && Math.random() > 0.98) {
        drops[i] = 0;
      }
    }
  }

  drawCRTNoise(now);
  requestAnimationFrame(matrixLoop);
}

requestAnimationFrame(matrixLoop);

/* ===== CRT NOISE ===== */
let noiseTicker = 0;

function drawCRTNoise(now) {
  const w = crtCanvas.width  / (window.devicePixelRatio || 1);
  const h = crtCanvas.height / (window.devicePixelRatio || 1);

  const base = matrixRunning ? 0.18 : 0.02;
  const flick = 0.5 + 0.5 * Math.sin(now / 120);
  const intensity = Math.min(1, base * flick);

  crtCanvas.style.opacity = `${Math.min(1, intensity * 2)}`;

  crtCtx.clearRect(0, 0, crtCanvas.width, crtCanvas.height);

  const cell = 3;
  const colsN = Math.ceil(w / cell);
  const rowsN = Math.ceil(h / cell);
  const noiseAmount = Math.floor(colsN * rowsN * intensity * 0.35);

  for (let n = 0; n < noiseAmount; n++) {
    const x = Math.floor(Math.random() * colsN) * cell;
    const y = Math.floor(Math.random() * rowsN) * cell;
    const alpha = 0.02 + Math.random() * 0.08;
    crtCtx.fillStyle = `rgba(255,255,255,${alpha})`;
    crtCtx.fillRect(x, y, cell, cell);
  }

  crtCtx.globalCompositeOperation = "overlay";

  const scanlineAlpha = 0.03 + Math.random() * 0.03;
  for (let y = 0; y < h; y += 2) {
    crtCtx.fillStyle = `rgba(0,0,0,${scanlineAlpha})`;
    crtCtx.fillRect(0, y, w, 1);
  }

  crtCtx.globalCompositeOperation = "source-over";

  crtCtx.fillStyle = `rgba(37,99,235,${0.004 * flick})`;
  crtCtx.fillRect(0, 0, w, h);

  noiseTicker++;

  if (noiseTicker % 120 === 0) {
    const burstAlpha = 0.06 + Math.random() * 0.08;
    crtCtx.fillStyle = `rgba(255,255,255,${burstAlpha})`;
    crtCtx.fillRect(
      Math.random() * w * 0.2,
      Math.random() * h * 0.2,
      w * (0.6 + Math.random() * 0.4),
      h * (0.6 + Math.random() * 0.4)
    );
  }
}

/* ===== ASCII LOGO (oculto a cada 2 minutos por 1s) ===== */
const ASCII_LOGO = [
  "  __   __ ",
  " /  \\ /  \\",
  "| ( ) ( ) |",
  " \\  / \\  / ",
  "  \\/   \\/  ",
  "  WAKE UP  "
];

function showAsciiLogo(duration = 1000) {
  if (!matrixRunning) return;

  // draw centered on canvas (uses CSS pixel coords—ctx already scaled)
  const savedFill = ctx.fillStyle;
  const savedShadow = ctx.shadowBlur;
  const savedFont = ctx.font;

  ctx.save();
  ctx.font = `28px monospace`;
  ctx.textBaseline = "middle";
  ctx.textAlign = "center";
  ctx.shadowColor = "#ffffff";
  ctx.shadowBlur = 16;

  const cx = innerWidth / 2;
  const cy = innerHeight / 2;
  const lineHeight = 34;

  for (let i = 0; i < ASCII_LOGO.length; i++) {
    const y = cy - ((ASCII_LOGO.length - 1) / 2) * lineHeight + i * lineHeight;
    // draw background rectangle for visibility
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    const textWidth = ctx.measureText(ASCII_LOGO[i]).width;
    ctx.fillRect(cx - textWidth/2 - 12, y - 18, textWidth + 24, 36);
    // draw text
    ctx.fillStyle = "#bff3ff";
    ctx.fillText(ASCII_LOGO[i], cx, y);
  }

  ctx.restore();

  // after duration, just let normal loop continue (we don't clear here,
  // fade will naturally cover it). If you want to absolutely remove, we could force a small redraw.
  setTimeout(() => {
    // small nudge draw to remove heavy shadow remnants
    ctx.fillStyle = "rgba(0,0,0,0.04)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }, duration);
}

/* inicial */
render();

/* ========= GESTOS PARA MOBILE + DESKTOP (funcionam apenas quando matrixRunning === true) ========= */

let lastTap = 0;
let touchStartY = null;
let touchEndY = null;
let clickTimer = null;

function matrixActive() {
  return matrixRunning === true;
}

/* TOUCH handlers */
document.addEventListener("touchstart", (e) => {
  if (!matrixActive()) return;
  touchStartY = e.changedTouches[0].screenY;
}, {passive:true});

document.addEventListener("touchend", (e) => {
  if (!matrixActive()) return;
  touchEndY = e.changedTouches[0].screenY;

  // detect swipe
  if (touchStartY !== null) {
    const diff = touchStartY - touchEndY;
    if (Math.abs(diff) >= 40) {
      if (diff > 0) { // swipe up
        triggerEffect("RAIN_FAST");
      } else { // swipe down
        triggerEffect("GLITCH");
      }
      touchStartY = null;
      return;
    }
  }

  // tap / double-tap
  const currentTap = Date.now();
  const tapInterval = currentTap - lastTap;

  if (tapInterval < 300) {
    // double tap
    triggerEffect("SHAKE");
    lastTap = 0;
  } else {
    // single tap
    triggerEffect("FLASH");
    lastTap = currentTap;
  }

  touchStartY = null;
}, {passive:true});

/* DESKTOP handlers (click + double-click behavior) */
document.addEventListener("pointerup", (e) => {
  // ignore if not matrix active
  if (!matrixActive()) return;

  const now = Date.now();
  const dt = now - (clickTimer || 0);

  if (dt < 300) {
    // second click within threshold -> double
    if (clickTimer) {
      clearTimeout(clickTimer);
      clickTimer = null;
    }
    triggerEffect("SHAKE");
    lastTap = 0;
  } else {
    // schedule single click action (if second click doesn't come)
    clickTimer = setTimeout(() => {
      triggerEffect("FLASH");
      clickTimer = null;
    }, 280);
    lastTap = now;
  }
});

/* ========= SISTEMA DE EFEITOS ========= */

function triggerEffect(type) {
  switch (type) {
    case "FLASH":
      flashScreen();
      break;

    case "SHAKE":
      shakeScreen();
      break;

    case "GLITCH":
      glitchScreen();
      break;

    case "RAIN_FAST":
      speedBoost();
      break;

    case "RAINBOW":
      startRainbow(5000); // default 5s
      break;

    default:
      console.warn("Efeito não reconhecido:", type);
  }
}

/* ========= EFETOS VISUAIS ========= */

// FLASH: breve aumento de brilho do canvas + crt
function flashScreen() {
  // quick bright flash
  canvas.style.transition = "none";
  crtCanvas.style.transition = "none";
  canvas.style.filter = "brightness(3.0)";
  crtCanvas.style.filter = "brightness(2.0)";
  setTimeout(() => {
    canvas.style.filter = "";
    crtCanvas.style.filter = "";
  }, 140);
}

// SHAKE: aplica animation shake
function shakeScreen() {
  const el = document.body; // sacudir o body/viewport para sensação maior
  el.style.animation = "shakeAnim 0.35s";
  // opcionais: aplicar também no canvas para compatibilidade
  canvas.style.animation = "shakeAnim 0.35s";
  setTimeout(() => {
    el.style.animation = "";
    canvas.style.animation = "";
  }, 350);
}

// GLITCH: pequenas traduções e filtros rápidos
function glitchScreen() {
  const origFilter = canvas.style.filter || "";
  let steps = 0;
  const iv = setInterval(() => {
    steps++;
    // random tiny shifts + high contrast
    canvas.style.transform = `translate(${(Math.random()*10-5).toFixed(1)}px, ${(Math.random()*6-3).toFixed(1)}px)`;
    canvas.style.filter = `contrast(${1 + Math.random()*1.2}) saturate(${1 + Math.random()*1.2})`;
    if (steps >= 8) {
      clearInterval(iv);
      canvas.style.transform = "";
      canvas.style.filter = origFilter;
    }
  }, 45);
}

// RAIN_FAST: aumenta velocidade por 3s (multiplica columnMultiplier)
function speedBoost() {
  // multiply all columnMultipliers
  for (let i = 0; i < columnMultiplier.length; i++) {
    columnMultiplier[i] *= 4;
  }
  setTimeout(() => {
    for (let i = 0; i < columnMultiplier.length; i++) {
      columnMultiplier[i] /= 4;
    }
  }, 3000);
}

// RAINBOW: ativa modo colorido por `duration` ms
function startRainbow(duration = 5000) {
  rainbowMode = true;
  rainbowExpires = performance.now() + duration;
}

/* ========= cleanup when page unloads ======== */
window.addEventListener("beforeunload", () => {
  if (asciiIntervalId) clearInterval(asciiIntervalId);
});
</script>

</body>
</html>
